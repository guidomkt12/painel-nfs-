name: Testes do Painelzinho
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile server.py demo.py test_server.py
      - run: python -m unittest -v test_server
      - run: node --check public/app.js
      - run: docker build -t painelzinho-keile:test .
